name: Build tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Нужно, чтобы CI мог закоммитить артефакты в ветку ci-logs
permissions:
  contents: write

jobs:
  build:
    # НЕ ubuntu-latest: с октября 2026 он мигрировал на Ubuntu 26,
    # где у установщика Theos ломаются зависимости (exit code 3).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          cat /etc/os-release
          uname -a

      # Готовый установщик Theos: ставит зависимости, Linux-тулчейн и все SDK.
      - name: Install Theos
        uses: Randomblock1/theos-action@v1.6
        with:
          theos-dir: ${{ github.workspace }}/theos

      - name: Verify Theos
        run: |
          set -euo pipefail
          echo "THEOS=${THEOS}"
          test -f "${THEOS}/makefiles/common.mk" || { echo "::error::Theos не установился: нет makefiles/common.mk"; exit 1; }
          test -d "${THEOS}/sdks/iPhoneOS15.6.sdk" || { echo "::error::Нет SDK iPhoneOS15.6"; ls "${THEOS}/sdks"; exit 1; }
          echo "--- clang ---"
          "${THEOS}/toolchain/linux/iphone/bin/clang" --version || true

      - name: Build .deb
        run: |
          set -o pipefail   # без этого ошибка make терялась в pipe на tee
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: FluidX-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Read version
        id: version
        if: success()
        run: |
          set -euo pipefail
          VALUE=$(awk '/^Version:/ {print $2}' control)
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"

      # Релиз с .deb. Версия берётся из control; если в ней есть beta/alpha,
      # релиз помечается как pre-release.
      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          PRE=""
          case "$VERSION" in
            *alpha*|*beta*|*rc*) PRE="--prerelease" ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже есть — обновляю файл"
            gh release upload "$TAG" packages/*.deb --clobber
          else
            gh release create "$TAG" packages/*.deb $PRE \
              --title "FluidX ${VERSION}" \
              --target "$GITHUB_SHA" \
              --notes-file RELEASE_NOTES.md
          fi

      # Публикуем артефакты в корень ветки ci-logs (без входа в GitHub):
      #   .../raw/ci-logs/build.log
      #   .../raw/ci-logs/<package>.deb
      - name: Publish artifacts
        if: always()
        run: |
          set -u
          PUB="${RUNNER_TEMP}/pub"
          rm -rf "$PUB"
          git worktree add --detach "$PUB"
          cd "$PUB"
          git switch --orphan ci-logs-release
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp "$GITHUB_WORKSPACE/build.log" ./build.log 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/packages/*.deb ./ 2>/dev/null || true

          {
            echo "run: ${{ github.run_number }}"
            echo "sha: ${{ github.sha }}"
            echo "status: ${{ job.status }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status.txt

          git config user.name "FluidX CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI: run ${{ github.run_number }} (${{ job.status }})" || exit 0
          git push --force origin HEAD:refs/heads/ci-logs
