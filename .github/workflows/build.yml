name: Build tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Нужно, чтобы CI мог закоммитить лог сборки в ветку ci-logs
permissions:
  contents: write

jobs:
  build:
    # НЕ ubuntu-latest: с октября 2026 он мигрировал на Ubuntu 26,
    # где у установщика Theos ломаются зависимости (exit code 3).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          cat /etc/os-release
          uname -a

      # Готовый установщик Theos: ставит зависимости, Linux-тулчейн и все SDK.
      # Сам обходит проблемы Ubuntu 26 (libxml2-16, binutils-gold).
      - name: Install Theos
        uses: Randomblock1/theos-action@v1.6
        with:
          theos-dir: ${{ github.workspace }}/theos

      - name: Verify Theos
        run: |
          set -euo pipefail
          echo "THEOS=${THEOS}"
          test -f "${THEOS}/makefiles/common.mk" || { echo "::error::Theos не установился: нет makefiles/common.mk"; exit 1; }
          test -d "${THEOS}/sdks/iPhoneOS15.6.sdk" || { echo "::error::Нет SDK iPhoneOS15.6"; ls "${THEOS}/sdks"; exit 1; }
          ls "${THEOS}/toolchain"/*/iphone/bin/clang* 2>/dev/null || true
          echo "--- clang ---"
          "${THEOS}/toolchain/linux/iphone/bin/clang" --version || true

      - name: Build .deb
        run: |
          set -o pipefail   # без этого ошибка make терялась в pipe на tee
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: FluidX-deb
          path: packages/*.deb
          if-no-files-found: error

      # Кладём .deb в публичную ветку: прямая ссылка без входа в GitHub.
      - name: Publish .deb
        if: success()
        run: |
          set -eu
          mkdir -p ci-logs
          cp packages/*.deb ci-logs/
          ls -l ci-logs/*.deb

      # Публикуем лог в ветку ci-logs: так причину падения видно без входа в GitHub.
      # raw.githubusercontent.com/vaibcode-dev/FluidX/ci-logs/build.log
      - name: Publish build log
        if: always()
        run: |
          set -u
          mkdir -p ci-logs
          if [ -f build.log ]; then cp build.log ci-logs/build.log; fi
          {
            echo "run: ${{ github.run_number }}"
            echo "sha: ${{ github.sha }}"
            echo "status: ${{ job.status }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- theos/makefiles/common.mk: $([ -f "${THEOS}/makefiles/common.mk" ] && echo ok || echo MISSING)"
            echo "--- sdks:"
            ls "${THEOS}/sdks" 2>/dev/null || echo "(нет каталога)"
            echo "--- packages:"
            ls -l packages 2>/dev/null || echo "(нет каталога)"
          } > ci-logs/status.txt
          git config user.name "FluidX CI"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "CI log: run ${{ github.run_number }} (${{ job.status }})" || exit 0
          git push --force origin HEAD:refs/heads/ci-logs
